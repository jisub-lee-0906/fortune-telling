services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fortune-backend
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fortune-frontend
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:8000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-3001}:3000"
