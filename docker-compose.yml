services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fortune-backend
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - FRONTEND_URLS=${FRONTEND_URLS:-http://localhost:3000}
      - INTERPRET_ENABLED=${INTERPRET_ENABLED:-false}
      - INTERPRET_SERVER_TOKEN=${INTERPRET_SERVER_TOKEN:-}
      - INTERPRET_REQUESTS_PER_MINUTE=${INTERPRET_REQUESTS_PER_MINUTE:-10}
      - INTERPRET_MAX_CONCURRENCY=${INTERPRET_MAX_CONCURRENCY:-2}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fortune-frontend
    depends_on:
      - backend
    environment:
      - PORT=3000
      - BACKEND_API_URL=${BACKEND_API_URL:-http://backend:8000}
      - INTERPRET_SERVER_TOKEN=${INTERPRET_SERVER_TOKEN:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-3001}:3000"
