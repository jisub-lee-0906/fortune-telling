services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fortune-backend
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - FRONTEND_URLS=${FRONTEND_URLS:-http://localhost:3000}
    restart: unless-stopped
    # Backend should stay internal. Coolify/other reverse proxy should route to 8000 container port.
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fortune-frontend
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:8000}
    restart: unless-stopped
    # Expose only frontend externally (change FRONTEND_HOST_PORT if needed)
    ports:
      - "${FRONTEND_HOST_PORT:-3001}:3000"
